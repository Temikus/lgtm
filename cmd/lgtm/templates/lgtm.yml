# LGTM scores pull requests with a System One decision model.
# https://github.com/Temikus/lgtm
name: LGTM

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  # Per event, so a review can't cancel a scoring run or the other way round.
  group: lgtm-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lgtm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      pull-requests: write
      issues: write
      contents: read
      # Read-only: lets LGTM see commit statuses from CI that isn't Actions.
      statuses: read
    # pull_request_target gives this job secrets and a write token while the
    # PR is untrusted. Never add a checkout or any other step to this job:
    # PR code running here would get both. LGTM reads the diff through the
    # API and its config from the base branch.
    steps:
      # For supply-chain safety, pin to a full commit SHA instead:
      #   uses: Temikus/lgtm@<commit SHA> # {{.Ref}}
      - uses: Temikus/lgtm@{{.Ref}}
        with:
          # Use a dedicated key with a spend limit.
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
