# Run with `just release [patch|minor|major]`. The tag points at a commit
# off main: main's head plus one commit that pins action.yml to the image
# digest built here. Main keeps building the Action from source.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as v0.1.0
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/temikus/lgtm
  VERSION: ${{ inputs.version }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check inputs
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::release from main only, not $GITHUB_REF"; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like v1.2.3, got $VERSION"; exit 1; }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag is new
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then echo "::error::$VERSION already exists"; exit 1; fi
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: go test -race -count=1 ./...
      - run: golangci-lint run
      - run: goreleaser check

  image:
    name: Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing and attestations
      attestations: write
      security-events: write # Grype SARIF upload
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push by digest only. The version tag goes on after scanning and signing.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
      # Scan by digest before signing, so a vulnerable image is never signed.
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity-cutoff: high
          only-fixed: "true"
          output-format: sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.scan.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - run: docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

  release:
    name: Release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # the pin commit, the version tag, and the draft release
      id-token: write # cosign keyless signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Safe to re-run: a version tag that already pins this digest is reused.
      - name: Commit the digest pin and tag it
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest $DIGEST"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            git show "$VERSION:action.yml" | grep -q "image: docker://$IMAGE@$DIGEST" || { echo "::error::$VERSION already pins another digest"; exit 1; }
            git checkout -q "$VERSION"
          else
            sed -i "s|^  image: Dockerfile$|  image: docker://$IMAGE@$DIGEST # $VERSION|" action.yml
            grep -q "image: docker://$IMAGE@$DIGEST" action.yml || { echo "::error::action.yml image line not found"; exit 1; }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -am "Pin the Action image for $VERSION"
            git tag -a "$VERSION" -m "$VERSION"
            git push origin "refs/tags/$VERSION"
          fi
          # Release tags aren't in each other's history, so name the previous one.
          prev=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -vxF "$VERSION" | head -1 || true)
          if [ -n "$prev" ]; then echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"; fi
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt

  # No registry login: this is what an Action user's runner sees.
  verify:
    name: Verify
    needs: [image, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    env:
      REF: ghcr.io/temikus/lgtm@${{ needs.image.outputs.digest }}
    steps:
      - name: Image is public
        run: |
          docker manifest inspect "$REF" >/dev/null || {
            echo "::error::$REF can't be pulled anonymously. Make the package public at https://github.com/users/Temikus/packages/container/lgtm/settings, then re-run failed jobs."
            exit 1
          }
      - name: Image reports the version
        run: docker run --rm "$REF" version | tee /dev/stderr | grep -q "lgtm $VERSION "
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Image signature
        run: |
          cosign verify "$REF" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
      - name: Image attestation
        run: gh attestation verify "oci://$REF" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Only a verified release moves the major tag and goes public.
  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move the major tag and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git tag -f "${VERSION%%.*}" "$VERSION^{commit}"
          git push -f origin "refs/tags/${VERSION%%.*}"
          gh release edit "$VERSION" --draft=false --latest
